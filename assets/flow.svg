<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 150" role="img" aria-label="/feature pipeline: Plan, Build, QA, Ship, Compound with approval gates">
  <defs>
    <filter id="fg" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <style>
      .lbl{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-weight:600;font-size:15px}
      .num{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-weight:700;font-size:13px;fill:#fff}
      .gate{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-weight:600;font-size:11px;letter-spacing:1px;fill:#8b949e}
    </style>
  </defs>

  <!-- connectors (drawn first, behind pills) -->
  <g fill="none" stroke-linecap="round">
    <!-- base tracks -->
    <line x1="170" y1="70" x2="221" y2="70" stroke="#30363d" stroke-width="3"/>
    <line x1="371" y1="70" x2="422" y2="70" stroke="#30363d" stroke-width="3"/>
    <line x1="572" y1="70" x2="623" y2="70" stroke="#30363d" stroke-width="3"/>
    <line x1="773" y1="70" x2="824" y2="70" stroke="#30363d" stroke-width="3"/>
    <!-- flowing dashes -->
    <line x1="170" y1="70" x2="221" y2="70" stroke="#58a6ff" stroke-width="3" stroke-dasharray="5 7">
      <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.1s" repeatCount="indefinite"/>
    </line>
    <line x1="371" y1="70" x2="422" y2="70" stroke="#e3b341" stroke-width="3" stroke-dasharray="5 7">
      <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.1s" repeatCount="indefinite"/>
    </line>
    <line x1="572" y1="70" x2="623" y2="70" stroke="#3fb950" stroke-width="3" stroke-dasharray="5 7">
      <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.1s" repeatCount="indefinite"/>
    </line>
    <line x1="773" y1="70" x2="824" y2="70" stroke="#a371f7" stroke-width="3" stroke-dasharray="5 7">
      <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.1s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- traveling pulse dots -->
  <g fill="#ffffff" filter="url(#fg)">
    <circle cy="70" r="3.2"><animate attributeName="cx" values="170;221" dur="1.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="1.4s" repeatCount="indefinite"/></circle>
    <circle cy="70" r="3.2"><animate attributeName="cx" values="371;422" dur="1.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="1.4s" repeatCount="indefinite"/></circle>
    <circle cy="70" r="3.2"><animate attributeName="cx" values="572;623" dur="1.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="1.4s" repeatCount="indefinite"/></circle>
    <circle cy="70" r="3.2"><animate attributeName="cx" values="773;824" dur="1.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="1.4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- gate labels under gated connectors -->
  <g class="gate" text-anchor="middle">
    <text x="195" y="104">✓ APPROVE</text>
    <text x="597" y="104">✓ SKIM</text>
    <text x="798" y="104">✓ REVIEW</text>
  </g>

  <!-- pills -->
  <!-- 1 Plan -->
  <g>
    <rect x="20" y="46" width="150" height="48" rx="24" fill="#1f6feb" fill-opacity="0.16" stroke="#1f6feb" stroke-width="1.5"/>
    <rect x="20" y="46" width="150" height="48" rx="24" fill="none" stroke="#58a6ff" stroke-width="1.5"><animate attributeName="stroke-opacity" values="0.7;0;0.7" dur="3s" repeatCount="indefinite"/></rect>
    <circle cx="46" cy="70" r="12" fill="#1f6feb"/><text x="46" y="74.5" text-anchor="middle" class="num">1</text>
    <text x="66" y="75" class="lbl" fill="#79c0ff">Plan</text>
  </g>
  <!-- 2 Build -->
  <g>
    <rect x="221" y="46" width="150" height="48" rx="24" fill="#6e7681" fill-opacity="0.16" stroke="#6e7681" stroke-width="1.5"/>
    <circle cx="247" cy="70" r="12" fill="#6e7681"/><text x="247" y="74.5" text-anchor="middle" class="num">2</text>
    <text x="267" y="75" class="lbl" fill="#adbac7">Build</text>
  </g>
  <!-- 3 QA -->
  <g>
    <rect x="422" y="46" width="150" height="48" rx="24" fill="#9e6a03" fill-opacity="0.18" stroke="#9e6a03" stroke-width="1.5"/>
    <rect x="422" y="46" width="150" height="48" rx="24" fill="none" stroke="#e3b341" stroke-width="1.5"><animate attributeName="stroke-opacity" values="0.7;0;0.7" dur="3s" begin="1s" repeatCount="indefinite"/></rect>
    <circle cx="448" cy="70" r="12" fill="#9e6a03"/><text x="448" y="74.5" text-anchor="middle" class="num">3</text>
    <text x="468" y="75" class="lbl" fill="#e3b341">QA</text>
  </g>
  <!-- 4 Ship -->
  <g>
    <rect x="623" y="46" width="150" height="48" rx="24" fill="#238636" fill-opacity="0.16" stroke="#238636" stroke-width="1.5"/>
    <rect x="623" y="46" width="150" height="48" rx="24" fill="none" stroke="#3fb950" stroke-width="1.5"><animate attributeName="stroke-opacity" values="0.7;0;0.7" dur="3s" begin="1.6s" repeatCount="indefinite"/></rect>
    <circle cx="649" cy="70" r="12" fill="#238636"/><text x="649" y="74.5" text-anchor="middle" class="num">4</text>
    <text x="669" y="75" class="lbl" fill="#7ee787">Ship</text>
  </g>
  <!-- 5 Compound -->
  <g>
    <rect x="824" y="46" width="150" height="48" rx="24" fill="#8957e5" fill-opacity="0.16" stroke="#8957e5" stroke-width="1.5"/>
    <circle cx="850" cy="70" r="12" fill="#8957e5"/><text x="850" y="74.5" text-anchor="middle" class="num">5</text>
    <text x="870" y="75" class="lbl" fill="#d2a8ff">Compound</text>
  </g>
</svg>
