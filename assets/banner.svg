<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" role="img" aria-label="rn-dev-workflow — one install, every React Native project">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e1a"/>
      <stop offset="0.55" stop-color="#150f33"/>
      <stop offset="1" stop-color="#05101d"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#22d3ee"/>
      <animate attributeName="x1" values="0;0.4;0" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;1.4;1" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="round"><rect x="0" y="0" width="1000" height="280" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="280" fill="url(#bg)"/>

    <!-- drifting aurora blobs -->
    <g opacity="0.55" filter="url(#soft)">
      <circle cx="840" cy="70" r="120" fill="#7c3aed">
        <animateTransform attributeName="transform" type="translate" values="0 0; -30 26; 0 0" dur="11s" repeatCount="indefinite"/>
      </circle>
      <circle cx="700" cy="235" r="110" fill="#2563eb">
        <animateTransform attributeName="transform" type="translate" values="0 0; 34 -18; 0 0" dur="13s" repeatCount="indefinite"/>
      </circle>
      <circle cx="965" cy="215" r="92" fill="#db2777">
        <animateTransform attributeName="transform" type="translate" values="0 0; -22 -24; 0 0" dur="9s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- faint dot grid -->
    <g fill="#5b6479" opacity="0.16">
      <circle cx="70" cy="40" r="2"/><circle cx="120" cy="40" r="2"/><circle cx="170" cy="40" r="2"/>
      <circle cx="70" cy="90" r="2"/><circle cx="120" cy="90" r="2"/>
      <circle cx="70" cy="240" r="2"/>
    </g>

    <!-- title -->
    <text x="60" y="118" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="62" font-weight="800" fill="url(#title)" filter="url(#glow)">rn-dev-workflow</text>

    <!-- moving shine over the title -->
    <g clip-path="url(#round)">
      <rect x="-320" y="52" width="220" height="90" fill="url(#shine)" opacity="0.14" transform="skewX(-22)">
        <animate attributeName="x" values="-320;1120" dur="5.5s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- tagline -->
    <text x="62" y="160" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#9aa6c4">One install. Every React Native project.</text>

    <!-- terminal chip -->
    <rect x="60" y="196" width="600" height="48" rx="11" fill="#0d1117" fill-opacity="0.9" stroke="#30363d" stroke-width="1"/>
    <circle cx="84" cy="220" r="5" fill="#ff5f56"/>
    <circle cx="102" cy="220" r="5" fill="#ffbd2e"/>
    <circle cx="120" cy="220" r="5" fill="#27c93f"/>
    <text x="142" y="226" font-family="'SF Mono','Fira Code',Menlo,Consolas,monospace" font-size="17" fill="#7ee787">$ /plugin install rn-workflow</text>
    <rect x="452" y="211" width="9" height="18" fill="#7ee787">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <!-- pill badges, right side -->
    <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600">
      <g>
        <rect x="726" y="196" width="96" height="26" rx="13" fill="#1f6feb" fill-opacity="0.18" stroke="#1f6feb" stroke-opacity="0.5"/>
        <text x="774" y="213" fill="#79c0ff" text-anchor="middle">/feature</text>
      </g>
      <g>
        <rect x="830" y="196" width="70" height="26" rx="13" fill="#238636" fill-opacity="0.18" stroke="#238636" stroke-opacity="0.5"/>
        <text x="865" y="213" fill="#7ee787" text-anchor="middle">/fix</text>
      </g>
      <g>
        <rect x="726" y="228" width="174" height="26" rx="13" fill="#8957e5" fill-opacity="0.18" stroke="#8957e5" stroke-opacity="0.5"/>
        <text x="813" y="245" fill="#d2a8ff" text-anchor="middle">tech-DNA · hooks · skills</text>
      </g>
    </g>

    <!-- thin gradient underline accent -->
    <rect x="60" y="176" width="250" height="3" rx="1.5" fill="url(#title)"/>

    <!-- border -->
    <rect x="0.5" y="0.5" width="999" height="279" rx="22" fill="none" stroke="#2b3350" stroke-width="1"/>
  </g>
</svg>
