<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 18" role="presentation">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a371f7" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="comet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#79c0ff"/>
      <stop offset="1" stop-color="#79c0ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="g" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <rect x="0" y="8" width="1000" height="2" rx="1" fill="url(#line)"/>

  <g>
    <ellipse cx="0" cy="9" rx="70" ry="3" fill="url(#comet)" opacity="0.7">
      <animate attributeName="cx" values="-80;1080" dur="4.5s" repeatCount="indefinite"/>
    </ellipse>
    <circle cx="0" cy="9" r="4" fill="#ffffff" filter="url(#g)">
      <animate attributeName="cx" values="-80;1080" dur="4.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
